name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create . --platforms=android --project-name yemeni_world --org com.genix

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=APP_ENV=development

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/yemeni-around-world-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: yemeni-around-world-android
          path: build/app/outputs/flutter-apk/yemeni-around-world-debug.apk
          if-no-files-found: error
          retention-days: 14
